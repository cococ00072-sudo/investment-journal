<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>정미의 투자 기록</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');

:root {
  --bg: #12151C; --surface: #1B2029; --surface-2: #212836; --border: #2A303E;
  --text: #ECEFF4; --muted: #8B93A5; --red: #E5484D; --blue: #4C8DFF; --gold: #D4A73D;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: 'Pretendard', -apple-system, sans-serif;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.wrap { width: 100%; max-width: 720px; text-align: center; }
.eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: var(--gold); text-transform: uppercase; margin-bottom: 10px; }
h1 { font-size: 26px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 40px; }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }

.card {
  display: block; text-decoration: none; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 32px 22px; transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
}
.card:hover { transform: translateY(-3px); border-color: var(--card-accent, var(--gold)); background: var(--surface-2); }
.card .icon { font-size: 34px; margin-bottom: 14px; display: block; }
.card .title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.card .desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.card .go { margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--card-accent, var(--gold)); }

.card.journal { --card-accent: #D4A73D; }
.card.trading { --card-accent: #E5484D; }

.footer-note { margin-top: 36px; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Investment Records</div>
    <h1>어떤 기록을 여실래요?</h1>
    <p class="sub">매일의 시장 관찰과 매매 데이터를 각각 관리합니다</p>

    <div class="cards">
      <a class="card journal" href="투자_일지_v11 (5).html">
        <span class="icon">📓</span>
        <div class="title">투자일지</div>
        <div class="desc">매크로 지표, 감정 기록, 매매 근거,<br/>경제 캘린더 · 지식 아카이브</div>
        <div class="go">열기 →</div>
      </a>
      <a class="card trading" href="매매일지.html">
        <span class="icon">📈</span>
        <div class="title">매매일지</div>
        <div class="desc">거래 · 배당 기록, 계좌별 손익,<br/>보유 종목 현황</div>
        <div class="go">열기 →</div>
      </a>
    </div>

    <p class="footer-note">두 앱 모두 같은 Supabase 프로젝트를 사용해 기기 간 동기화됩니다</p>
  </div>
</body>
</html>

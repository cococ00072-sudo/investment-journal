@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
  --bg: #12151C; --surface: #1B2029; --surface-2: #212836; --border: #2A303E;
  --text: #ECEFF4; --muted: #8B93A5; --red: #E5484D; --blue: #4C8DFF; --gold: #D4A73D;

* { box-sizing: border-box; }
body { margin: 0; font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg); color: var(--text); }
#app { max-width: 1040px; margin: 0 auto; padding: 20px; }
.pnl-pos { color: var(--red); font-variant-numeric: tabular-nums; }
.pnl-neg { color: var(--blue); font-variant-numeric: tabular-nums; }
.dividend { color: var(--gold); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

.tj-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.tj-brand { display: flex; gap: 12px; align-items: flex-start; }
.tj-brand-mark { font-size: 26px; }
.tj-brand h1 { font-size: 20px; margin: 0 0 2px; font-weight: 700; letter-spacing: -0.01em; }
.tj-brand p { font-size: 12.5px; color: var(--muted); margin: 0; }
.tj-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 600;

.btn-primary { background: var(--gold); color: #1A1608; border-color: var(--gold); }

.btn-ghost { background: var(--surface); color: var(--text); }
.btn-ghost:hover { background: var(--surface-2); }

.tj-ticker { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border);

.tj-ticker-item { display: flex; flex-direction: column; gap: 3px; white-space: nowrap; }
.tj-ticker-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.tj-ticker-value { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; }
.tj-ticker-divider { width: 1px; height: 26px; background: var(--border); flex-shrink: 0; }

.tj-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tj-tab { display: flex; align-items: center; gap: 6px; background: transparent; border: none; color: var(--muted);

.tj-tab.active { color: var(--text); border-bottom-color: var(--gold); }

.tj-empty { text-align: center; color: var(--muted); padding: 48px 12px; font-size: 13.5px; }
.tj-empty.small { padding: 24px 12px; }

.tj-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.tj-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

.tj-stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.tj-stat-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.tj-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; }

.tj-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.tj-card h3 { font-size: 14px; margin: 0 0 12px; font-weight: 700; }

.tj-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 11.5px; color: var(--muted); }

.tj-holding-mid { display: flex; flex-direction: column; align-items: flex-end; font-size: 12.5px; font-family: 'JetBrains Mono', monospace; }
.tj-holding-right { display: flex; flex-direction: column; align-items: flex-end; font-size: 12.5px; font-family: 'JetBrains Mono', monospace; gap: 2px; }

.tj-search input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 13.5px; }

.tj-trade-list { display: flex; flex-direction: column; gap: 8px; }
.tj-trade-row { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border);

.tj-trade-date { display: flex; flex-direction: column; min-width: 78px; font-size: 11.5px; color: var(--muted); }

.tj-trade-main { flex: 1; min-width: 200px; }
.tj-trade-name-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }

.tj-trade-name-line .code { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

.side-btn.sell.active { background: rgba(76,141,255,0.16); color: var(--blue); border-color: var(--blue); }

.tj-form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--muted); }

const fmtPct = (n) => (n === null || n === undefined || isNaN(n)) ? "—" : (n * 100).toFixed(2) + "%";
const signed = (n) => (n >= 0 ? "+" : "");
const todayStr = () => new Date().toISOString().slice(0, 10);
const monthOf = (d) => (d || "").slice(0, 7);
const esc = (s) => (s || "").toString().replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function showToast(msg, type) { toast = { msg, type }; render(); setTimeout(() => { toast = null; renderToastOnly(); }, 2600); }

async function loadAll() {
  const [t, d, s, sc] = await Promise.all([
    sb.from("trades").select("*").order("date", { ascending: true }),
    sb.from("dividends").select("*").order("date", { ascending: true }),
    sb.from("stocks").select("*"),
    sb.from("scalp_trades").select("*").order("date", { ascending: true }),
  ]);
  if (t.error || d.error || s.error || sc.error) {
    showToast("데이터를 불러오지 못했습니다: " + (t.error || d.error || s.error || sc.error).message, "error");
    return;
  }
  trades = t.data.map(rowToTrade);
  dividends = d.data.map(rowToDividend);
  stocks = s.data.map(rowToStock);
  scalps = sc.data.map(rowToScalp);
  render();
}
function rowToTrade(r) { return { id: r.id, date: r.date, market: r.market, code: r.code, name: r.name, side: r.side, account: r.account, qty: Number(r.qty), price: Number(r.price), fee: Number(r.fee || 0), tax: Number(r.tax || 0), memo: r.memo || "", created_at: r.created_at }; }
function rowToDividend(r) { return { id: r.id, date: r.date, code: r.code, name: r.name, perShare: Number(r.per_share), qty: Number(r.qty), tax: Number(r.tax || 0), memo: r.memo || "" }; }
function rowToStock(r) { return { code: r.code, name: r.name, market: r.market, currentPrice: r.current_price === null ? null : Number(r.current_price), memo: r.memo || "" }; }
function rowToScalp(r) { return { id: r.id, date: r.date, code: r.code, name: r.name, account: r.account, buyPrice: Number(r.buy_price), sellPrice: Number(r.sell_price), qty: Number(r.qty), fee: Number(r.fee || 0), memo: r.memo || "" }; }

async function registerStockIfNew(code, name, market) {
  const existing = stocks.find((s) => s.code === code);
  if (!existing) {
    const { error } = await sb.from("stocks").insert({ code, name, market, current_price: null, memo: "" });
    if (!error) stocks.push({ code, name, market, currentPrice: null, memo: "" });
  } else if (name && existing.name !== name) {
    await sb.from("stocks").update({ name }).eq("code", code);
    existing.name = name;
  }
}

// ---------------------------------------------------------------------
// ledger math — average cost, grouped by 계좌+종목코드
// ---------------------------------------------------------------------
function computeLedger(list) {
  const sorted = [...list].sort((a, b) => (a.date !== b.date ? (a.date < b.date ? -1 : 1) : (new Date(a.created_at) - new Date(b.created_at))));
  const positions = {}, byId = {};
  for (const t of sorted) {
    const account = t.account || "미지정";
    const key = account + "__" + t.code;
    const pos = positions[key] || { qty: 0, totalCost: 0, name: t.name, account, code: t.code };
    pos.name = t.name || pos.name;
    const gross = t.qty * t.price;
    let totalAmount, costBasis = null, realizedPnl = null, pnlPct = null;
    if (t.side === "매수") {
      totalAmount = -(gross + t.fee + t.tax);
      pos.qty += t.qty; pos.totalCost += gross + t.fee + t.tax;
    } else {
      totalAmount = gross - t.fee - t.tax;
      const avgCost = pos.qty > 0 ? pos.totalCost / pos.qty : 0;
      costBasis = avgCost * t.qty;
      realizedPnl = totalAmount - costBasis;
      pnlPct = costBasis !== 0 ? realizedPnl / costBasis : null;
      pos.qty = Math.max(0, pos.qty - t.qty);
      pos.totalCost = Math.max(0, pos.totalCost - costBasis);
      if (pos.qty <= 1e-9) { pos.qty = 0; pos.totalCost = 0; }
    }
    positions[key] = pos;
    byId[t.id] = Object.assign({}, t, { totalAmount, costBasis, realizedPnl, pnlPct });
  }
  return { byId, positions };
}
function rollupByCode(positions) {
  const byCode = {};
  Object.values(positions).forEach((p) => {
    const acc = byCode[p.code] || { qty: 0, totalCost: 0, name: p.name };
    acc.qty += p.qty; acc.totalCost += p.totalCost; acc.name = p.name || acc.name;
    byCode[p.code] = acc;
  });
  return byCode;
}

function stockByCode(code) { return stocks.find((s) => s.code === code); }

function computeStats() {
  const { byId, positions } = computeLedger(trades);
  const codePositions = rollupByCode(positions);
  const enrichedTrades = trades.map((t) => byId[t.id]).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  const sells = enrichedTrades.filter((t) => t.side === "매도");
  const totalRealized = sells.reduce((s, t) => s + (t.realizedPnl || 0), 0);
  const totalSellCost = sells.reduce((s, t) => s + (t.costBasis || 0), 0);
  const wins = sells.filter((t) => (t.realizedPnl || 0) > 0).length;
  const winRate = sells.length ? wins / sells.length : null;

  const totalDividend = dividends.reduce((s, d) => s + (d.perShare * d.qty - d.tax), 0);
  const totalCombined = totalRealized + totalDividend;
  const tradeReturnPct = totalSellCost ? totalRealized / totalSellCost : null;
  const combinedReturnPct = totalSellCost ? totalCombined / totalSellCost : null;

  const thisMonth = monthOf(todayStr());
  const monthPnl = sells.filter((t) => monthOf(t.date) === thisMonth).reduce((s, t) => s + (t.realizedPnl || 0), 0);
  const monthDividend = dividends.filter((d) => monthOf(d.date) === thisMonth).reduce((s, d) => s + (d.perShare * d.qty - d.tax), 0);

  const monthlyMap = {};
  sells.forEach((t) => { const m = monthOf(t.date); monthlyMap[m] = monthlyMap[m] || { trade: 0, dividend: 0 }; monthlyMap[m].trade += t.realizedPnl || 0; });
  dividends.forEach((d) => { const m = monthOf(d.date); monthlyMap[m] = monthlyMap[m] || { trade: 0, dividend: 0 }; monthlyMap[m].dividend += d.perShare * d.qty - d.tax; });
  const monthly = Object.entries(monthlyMap).sort(([a], [b]) => (a < b ? -1 : 1)).map(([month, v]) => ({ month: month.slice(2), trade: v.trade, dividend: v.dividend }));

  const best = sells.reduce((m, t) => (m === null || (t.realizedPnl || 0) > (m.realizedPnl || 0) ? t : m), null);
  const worst = sells.reduce((m, t) => (m === null || (t.realizedPnl || 0) < (m.realizedPnl || 0) ? t : m), null);

  const holdings = Object.entries(codePositions).filter(([, p]) => p.qty > 0).map(([code, p]) => {
    const avgCost = p.totalCost / p.qty;
    const cur = stockByCode(code) ? stockByCode(code).currentPrice : null;
    const unrealized = cur != null ? (cur - avgCost) * p.qty : null;
    const unrealizedPct = cur != null && avgCost ? (cur - avgCost) / avgCost : null;
    return { code, name: p.name, qty: p.qty, avgCost, currentPrice: cur, unrealized, unrealizedPct };
  });

  const accMap = {};
  Object.values(positions).forEach((p) => {
    const a = accMap[p.account] || { account: p.account, holdings: [], realizedPnl: 0 };
    if (p.qty > 0) {
      const avgCost = p.totalCost / p.qty;
      const cur = stockByCode(p.code) ? stockByCode(p.code).currentPrice : null;
      a.holdings.push({ code: p.code, name: p.name, qty: p.qty, avgCost, currentPrice: cur, valuation: cur != null ? cur * p.qty : null });
    }
    accMap[p.account] = a;
  });
  sells.forEach((t) => { const acc = t.account || "미지정"; const a = accMap[acc] || { account: acc, holdings: [], realizedPnl: 0 }; a.realizedPnl += t.realizedPnl || 0; accMap[acc] = a; });
  const accountStats = Object.values(accMap).map((a) => ({ ...a, qtyTotal: a.holdings.reduce((s, h) => s + h.qty, 0), valuationTotal: a.holdings.reduce((s, h) => s + (h.valuation || 0), 0) })).sort((x, y) => (x.account < y.account ? -1 : 1));

  return { enrichedTrades, totalRealized, totalDividend, totalCombined, tradeReturnPct, combinedReturnPct, winRate, sellCount: sells.length, monthPnl, monthDividend, monthly, best, worst, holdings, accountStats, totalTrades: trades.length, totalDividendCount: dividends.length };
}

// ---------------------------------------------------------------------
// 단타기록 — 완전히 별도 테이블/계산. 평균단가 원장(computeLedger)과는
// 전혀 섞이지 않고, 한 줄이 곧 하루짜리 단타 1건(매수가·매도가·수량)이다.
// ---------------------------------------------------------------------
function enrichScalp(s) {
  const gross = (s.sellPrice - s.buyPrice) * s.qty;
  const pnl = gross - s.fee;
  const cost = s.buyPrice * s.qty;
  const pnlPct = cost ? pnl / cost : null;
  return Object.assign({}, s, { pnl, pnlPct });
}
function computeScalpStats() {
  const enriched = scalps.map(enrichScalp).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  const totalPnl = enriched.reduce((s, t) => s + t.pnl, 0);
  const wins = enriched.filter((t) => t.pnl > 0).length;
  const winRate = enriched.length ? wins / enriched.length : null;
  const today = todayStr();
  const todayPnl = enriched.filter((t) => t.date === today).reduce((s, t) => s + t.pnl, 0);
  const todayCount = enriched.filter((t) => t.date === today).length;
  const best = enriched.reduce((m, t) => (m === null || t.pnl > m.pnl ? t : m), null);
  const worst = enriched.reduce((m, t) => (m === null || t.pnl < m.pnl ? t : m), null);
  return { enriched, totalPnl, winRate, count: enriched.length, todayPnl, todayCount, best, worst };
}

function bulkAccountName() { return bulk.account === "__custom" ? bulk.custom.trim() : bulk.account; }
function bulkRowCalc(r) {
  const qty = Number(r.qty) || 0, avg = Number(r.avg) || 0, cur = Number(r.cur) || 0;
  const cost = qty * avg, val = cur ? qty * cur : null;
  const pnl = val === null ? null : val - cost;
  return { cost, val, pnl, pct: pnl !== null && cost ? pnl / cost : null };
}
function bulkTotals(rows) {
  let cost = 0, val = 0;
  rows.forEach((r) => { const c = bulkRowCalc(r); cost += c.cost; val += c.val || 0; });
  return { cost, val, pnl: val - cost, pct: cost ? (val - cost) / cost : null };
}
function pnlSpan(pnl, pct) {
  if (pnl === null) return `<span class="muted">—</span>`;
  const cls = pnl >= 0 ? "pnl-pos" : "pnl-neg";
  return `<span class="${cls}">${signed(pnl)}${fmt(pnl)}${pct !== null ? ` (${signed(pct)}${(pct * 100).toFixed(2)}%)` : ""}</span>`;
}
function bulkSummaryHtml() {
  const t = bulkTotals(bulk.rows);
  return `<span class="muted">${bulk.rows.length}종목</span>

    <span>평가 <b>${fmt(t.val)}</b>원</span>
    <span>손익 <b>${pnlSpan(t.pnl, t.pct)}</b></span>`;
}

function cleanBulkRows(rows) {
  const out = [], bad = [];
  rows.forEach((r, i) => {
    const name = String(r.name || "").trim();
    if (!name && !r.qty && !r.avg) return; // 완전 빈 행은 무시
    const qty = Number(r.qty), avg = Number(r.avg), cur = r.cur === "" || r.cur === null ? null : Number(r.cur);
    if (!name || !(qty > 0) || !(avg > 0)) { bad.push(i + 1); return; }
    const code = String(r.code || "").trim() || name;
    out.push({ code, name, market: r.market || "국내", qty, avg, cur: cur > 0 ? cur : null });
  });
  return { out, bad };
}

async function setCurrentPrice(code, price) {
  if (price === null) return;
  const { error } = await sb.from("stocks").update({ current_price: price, price_updated_at: new Date().toISOString() }).eq("code", code);
  if (!error) { const st = stockByCode(code); if (st) st.currentPrice = price; }
}

async function saveOpening(account, rows, date, replace) {
  if (replace) {
    const { error } = await sb.from("trades").delete().eq("account", account).eq("memo", OPENING_MEMO);
    if (error) throw new Error("기존 기초잔고 삭제 실패: " + error.message);
    trades = trades.filter((t) => !(t.account === account && t.memo === OPENING_MEMO));
  }
  const payload = rows.map((r) => ({ date, market: r.market, code: r.code, name: r.name, side: "매수", account, qty: r.qty, price: r.avg, fee: 0, tax: 0, memo: OPENING_MEMO }));
  const { data, error } = await sb.from("trades").insert(payload).select();
  if (error) throw new Error("저장 실패: " + error.message);
  data.forEach((row) => trades.push(rowToTrade(row)));
  for (const r of rows) { await registerStockIfNew(r.code, r.name, r.market); await setCurrentPrice(r.code, r.cur); }
  return rows.length;
}

function attachBulkHandlers() {
  if (tab !== "bulk") return;
  const acc = document.getElementById("bk-account");
  if (acc) acc.onchange = () => {
    bulk.account = acc.value;
    bulk.rows = PRESET[bulk.account] ? presetRows(bulk.account) : [emptyRow()];
    render();
  };
  const custom = document.getElementById("bk-custom");
  if (custom) custom.oninput = (e) => { bulk.custom = e.target.value; };
  const date = document.getElementById("bk-date"); if (date) date.onchange = (e) => { bulk.date = e.target.value; };
  const rep = document.getElementById("bk-replace"); if (rep) rep.onchange = (e) => { bulk.replace = e.target.checked; };

  document.querySelectorAll("[data-bk]").forEach((el) => {
    const handler = () => {
      const i = Number(el.dataset.bk), f = el.dataset.f;
      bulk.rows[i][f] = el.value.replace(/,/g, "");
      if (f === "code") el.classList.toggle("need", !el.value.trim());
      const c = bulkRowCalc(bulk.rows[i]);
      const costEl = document.getElementById("bk-cost-" + i); if (costEl) costEl.textContent = fmt(c.cost);
      const pnlEl = document.getElementById("bk-pnl-" + i); if (pnlEl) pnlEl.innerHTML = pnlSpan(c.pnl, c.pct);
      const sum = document.getElementById("bk-summary"); if (sum) sum.innerHTML = bulkSummaryHtml();
    };
    el.oninput = handler; el.onchange = handler;
  });
  document.querySelectorAll("[data-bk-del]").forEach((el) => el.onclick = () => { bulk.rows.splice(Number(el.dataset.bkDel), 1); render(); });

  const add = document.getElementById("bk-add-row"); if (add) add.onclick = () => { bulk.rows.push(emptyRow()); render(); };
  const clear = document.getElementById("bk-clear"); if (clear) clear.onclick = () => { bulk.rows = [emptyRow()]; render(); };
  const lp = document.getElementById("bk-load-preset"); if (lp) lp.onclick = () => { bulk.rows = presetRows(bulk.account); render(); };
  const lc = document.getElementById("bk-load-current"); if (lc) lc.onclick = () => {
    const name = bulkAccountName();
    const { positions } = computeLedger(trades);
    const rows = Object.values(positions).filter((p) => p.account === name && p.qty > 0).map((p) => {
      const st = stockByCode(p.code);
      return { code: p.code, name: p.name, market: st ? st.market : "국내", qty: p.qty, avg: Math.round(p.totalCost / p.qty), cur: st && st.currentPrice != null ? st.currentPrice : "" };
    });
    if (!rows.length) { showToast("이 계좌에 저장된 보유 종목이 없어요", "error"); return; }
    bulk.rows = rows; render(); showToast("현재 보유를 불러왔어요 — 현재가만 고치고 '현재가만 업데이트'를 누르세요");
  };

  const po = document.getElementById("bk-price-only"); if (po) po.onclick = async () => {
    const { out } = cleanBulkRows(bulk.rows);
    const targets = out.filter((r) => r.cur !== null && stockByCode(r.code));
    if (!targets.length) { showToast("업데이트할 종목이 없어요 (먼저 저장된 종목이어야 해요)", "error"); return; }
    bulk.busy = true; render();
    for (const r of targets) await setCurrentPrice(r.code, r.cur);
    bulk.busy = false; showToast(`현재가 ${targets.length}종목을 업데이트했어요`); render();
  };

  const save = document.getElementById("bk-save"); if (save) save.onclick = async () => {
    const account = bulkAccountName();
    if (!account) { showToast("계좌 이름을 입력해 주세요", "error"); return; }
    if (!bulk.date) { showToast("기준일을 선택해 주세요", "error"); return; }
    const { out, bad } = cleanBulkRows(bulk.rows);
    if (bad.length) { showToast(`${bad.join(", ")}번째 행: 종목명·수량·평균단가를 확인해 주세요`, "error"); return; }
    if (!out.length) { showToast("저장할 종목이 없어요", "error"); return; }
    const t = bulkTotals(out.map((r) => ({ qty: r.qty, avg: r.avg, cur: r.cur || "" })));
    if (!confirm(`[${account}] ${out.length}종목 · 매입 ${fmt(t.cost)}원을 기초잔고로 저장할까요?${bulk.replace ? "\n(기존 기초잔고는 지우고 새로 저장)" : ""}`)) return;
    bulk.busy = true; render();
    try { const n = await saveOpening(account, out, bulk.date, bulk.replace); showToast(`${account} ${n}종목을 저장했어요`); }
    catch (e) { showToast(e.message, "error"); }
    bulk.busy = false; render();
  };

  const all = document.getElementById("bk-save-all"); if (all) all.onclick = async () => {
    const names = Object.keys(PRESET);
    const missing = names.reduce((s, a) => s + PRESET[a].filter((r) => !r[0]).length, 0);
    if (!confirm(`캡처값 ${names.length}개 계좌(${names.join(", ")})를 한 번에 기초잔고로 저장할까요?\n각 계좌의 기존 기초잔고는 지우고 새로 저장해요.${missing ? `\n\n※ 종목코드가 비어 있는 ${missing}개는 종목명을 코드로 저장해요. 코드를 먼저 채우려면 계좌별로 저장하세요.` : ""}`)) return;
    bulk.busy = true; render();
    let total = 0;
    try {
      for (const a of names) {
        const rows = a === bulk.account ? bulk.rows : presetRows(a); // 지금 화면에서 고친 계좌는 수정값 사용
        const { out, bad } = cleanBulkRows(rows);
        if (bad.length) throw new Error(`${a} ${bad.join(", ")}번째 행을 확인해 주세요`);
        total += await saveOpening(a, out, bulk.date, true);
      }
      showToast(`${names.length}개 계좌 ${total}종목을 저장했어요`);
    } catch (e) { showToast(e.message, "error"); }
    bulk.busy = false; render();
  };
}

// ---------------------------------------------------------------------
// event handlers
// ---------------------------------------------------------------------
function attachHandlers() {
  attachBulkHandlers();
  document.querySelectorAll("[data-tab]").forEach((el) => el.onclick = () => { tab = el.dataset.tab; render(); });
  const addTrade = document.getElementById("btn-add-trade"); if (addTrade) addTrade.onclick = () => { tradeModal = { editing: null, side: "매수" }; render(); };
  const addDiv = document.getElementById("btn-add-div"); if (addDiv) addDiv.onclick = () => { divModal = { editing: null }; render(); };
  const addScalp = document.getElementById("btn-add-scalp"); if (addScalp) addScalp.onclick = () => { scalpModal = { editing: null }; render(); };

  const search = document.getElementById("trade-search");
  if (search) search.oninput = (e) => { query = e.target.value; render(); setTimeout(() => document.getElementById("trade-search")?.focus(), 0); };

  document.querySelectorAll("[data-edit-trade]").forEach((el) => el.onclick = () => { tradeModal = { editing: trades.find((t) => t.id === el.dataset.editTrade) }; render(); });
  document.querySelectorAll("[data-del-trade]").forEach((el) => el.onclick = async () => {
    if (!confirm("이 거래 기록을 삭제할까요?")) return;
    const { error } = await sb.from("trades").delete().eq("id", el.dataset.delTrade);
    if (error) { showToast("삭제 실패: " + error.message, "error"); return; }
    trades = trades.filter((t) => t.id !== el.dataset.delTrade);
    showToast("삭제했습니다"); render();
  });
  document.querySelectorAll("[data-edit-div]").forEach((el) => el.onclick = () => { divModal = { editing: dividends.find((d) => d.id === el.dataset.editDiv) }; render(); });
  document.querySelectorAll("[data-del-div]").forEach((el) => el.onclick = async () => {
    if (!confirm("이 배당 기록을 삭제할까요?")) return;
    const { error } = await sb.from("dividends").delete().eq("id", el.dataset.delDiv);
    if (error) { showToast("삭제 실패: " + error.message, "error"); return; }
    dividends = dividends.filter((d) => d.id !== el.dataset.delDiv);
    showToast("삭제했습니다"); render();
  });

  document.querySelectorAll("[data-edit-scalp]").forEach((el) => el.onclick = () => { scalpModal = { editing: scalps.find((t) => t.id === el.dataset.editScalp) }; render(); });
  document.querySelectorAll("[data-del-scalp]").forEach((el) => el.onclick = async () => {
    if (!confirm("이 단타 기록을 삭제할까요?")) return;
    const { error } = await sb.from("scalp_trades").delete().eq("id", el.dataset.delScalp);
    if (error) { showToast("삭제 실패: " + error.message, "error"); return; }
    scalps = scalps.filter((t) => t.id !== el.dataset.delScalp);
    showToast("삭제했습니다"); render();
  });

  document.querySelectorAll("[data-price-code]").forEach((el) => el.onchange = async () => {
    const code = el.dataset.priceCode, val = el.value === "" ? null : Number(el.value);
    const { error } = await sb.from("stocks").update({ current_price: val, price_updated_at: new Date().toISOString() }).eq("code", code);
    if (error) { showToast("저장 실패: " + error.message, "error"); return; }
    const st = stockByCode(code); if (st) st.currentPrice = val;
    showToast("현재가를 저장했습니다"); render();
  });
  document.querySelectorAll("[data-memo-code]").forEach((el) => el.onchange = async () => {
    const code = el.dataset.memoCode;
    const { error } = await sb.from("stocks").update({ memo: el.value }).eq("code", code);
    if (error) { showToast("저장 실패: " + error.message, "error"); return; }
    const st = stockByCode(code); if (st) st.memo = el.value;
  });

  // trade modal
  const tOverlay = document.getElementById("trade-overlay");
  if (tOverlay) {
    tOverlay.onclick = (e) => { if (e.target === tOverlay) { tradeModal = null; render(); } };
    document.getElementById("trade-close").onclick = () => { tradeModal = null; render(); };
    document.getElementById("trade-cancel").onclick = () => { tradeModal = null; render(); };
    document.querySelectorAll("[data-side]").forEach((el) => el.onclick = () => { tradeModal.side = el.dataset.side; render(); });
    const updatePreview = () => {
      const qty = Number(document.getElementById("f-qty").value) || 0, price = Number(document.getElementById("f-price").value) || 0;
      const fee = Number(document.getElementById("f-fee").value) || 0, tax = Number(document.getElementById("f-tax").value) || 0;
      const side = tradeModal.side || (tradeModal.editing ? tradeModal.editing.side : "매수");
      const total = side === "매수" ? -(qty * price + fee + tax) : qty * price - fee - tax;
      const el = document.getElementById("f-total-preview");
      el.textContent = signed(total) + fmt(total) + "원";
      el.className = total >= 0 ? "pnl-pos" : "pnl-neg";
    };
    ["f-qty", "f-price", "f-fee", "f-tax"].forEach((id) => document.getElementById(id).oninput = updatePreview);
    updatePreview();
    document.getElementById("trade-save").onclick = async () => {
      const form = {
        date: document.getElementById("f-date").value,
        market: document.getElementById("f-market").value,
        code: document.getElementById("f-code").value.trim(),
        name: document.getElementById("f-name").value.trim(),
        side: tradeModal.side || (tradeModal.editing ? tradeModal.editing.side : "매수"),
        account: document.getElementById("f-account").value.trim(),
        qty: Number(document.getElementById("f-qty").value),
        price: Number(document.getElementById("f-price").value),
        fee: Number(document.getElementById("f-fee").value) || 0,
        tax: Number(document.getElementById("f-tax").value) || 0,
        memo: document.getElementById("f-memo").value.trim(),
      };
      if (!form.code || !form.name || !form.qty || !form.price) { showToast("종목코드/종목명/수량/단가는 필수입니다", "error"); return; }
      if (tradeModal.editing) {
        const { error } = await sb.from("trades").update(form).eq("id", tradeModal.editing.id);
        if (error) { showToast("저장 실패: " + error.message, "error"); return; }
        Object.assign(tradeModal.editing, form);
      } else {
        const { data, error } = await sb.from("trades").insert(form).select().single();
        if (error) { showToast("저장 실패: " + error.message, "error"); return; }
        trades.push(rowToTrade(data));
      }
      await registerStockIfNew(form.code, form.name, form.market);
      showToast(tradeModal.editing ? "거래를 수정했습니다" : "거래를 저장했습니다");
      tradeModal = null; render();
    };
  }

  // dividend modal
  const dOverlay = document.getElementById("div-overlay");
  if (dOverlay) {
    dOverlay.onclick = (e) => { if (e.target === dOverlay) { divModal = null; render(); } };
    document.getElementById("div-close").onclick = () => { divModal = null; render(); };
    document.getElementById("div-cancel").onclick = () => { divModal = null; render(); };
    const updatePreview = () => {
      const perShare = Number(document.getElementById("d-perShare").value) || 0, qty = Number(document.getElementById("d-qty").value) || 0, tax = Number(document.getElementById("d-tax").value) || 0;
      document.getElementById("d-total-preview").textContent = "+" + fmt(perShare * qty - tax) + "원";
    };
    ["d-perShare", "d-qty", "d-tax"].forEach((id) => document.getElementById(id).oninput = updatePreview);
    updatePreview();
    document.getElementById("div-save").onclick = async () => {
      const form = {
        date: document.getElementById("d-date").value,
        code: document.getElementById("d-code").value.trim(),
        name: document.getElementById("d-name").value.trim(),
        per_share: Number(document.getElementById("d-perShare").value),
        qty: Number(document.getElementById("d-qty").value),
        tax: Number(document.getElementById("d-tax").value) || 0,
        memo: document.getElementById("d-memo").value.trim(),
      };
      if (!form.code || !form.name || !form.per_share || !form.qty) { showToast("종목코드/종목명/주당배당/보유수량은 필수입니다", "error"); return; }
      if (divModal.editing) {
        const { error } = await sb.from("dividends").update(form).eq("id", divModal.editing.id);
        if (error) { showToast("저장 실패: " + error.message, "error"); return; }
        Object.assign(divModal.editing, rowToDividend(form));
      } else {
        const { data, error } = await sb.from("dividends").insert(form).select().single();
        if (error) { showToast("저장 실패: " + error.message, "error"); return; }
        dividends.push(rowToDividend(data));
      }
      await registerStockIfNew(form.code, form.name, "국내");
      showToast(divModal.editing ? "배당 기록을 수정했습니다" : "배당 기록을 저장했습니다");
      divModal = null; render();
    };
  }

  // scalp modal
  const scOverlay = document.getElementById("scalp-overlay");
  if (scOverlay) {
    scOverlay.onclick = (e) => { if (e.target === scOverlay) { scalpModal = null; render(); } };
    document.getElementById("scalp-close").onclick = () => { scalpModal = null; render(); };
    document.getElementById("scalp-cancel").onclick = () => { scalpModal = null; render(); };
    const updatePreview = () => {
      const buy = Number(document.getElementById("sc-buy").value) || 0, sell = Number(document.getElementById("sc-sell").value) || 0;
      const qty = Number(document.getElementById("sc-qty").value) || 0, fee = Number(document.getElementById("sc-fee").value) || 0;
      const pnl = (sell - buy) * qty - fee;
      const el = document.getElementById("sc-total-preview");
      el.textContent = signed(pnl) + fmt(pnl) + "원";
      el.className = pnl >= 0 ? "pnl-pos" : "pnl-neg";
    };
    ["sc-buy", "sc-sell", "sc-qty", "sc-fee"].forEach((id) => document.getElementById(id).oninput = updatePreview);
    updatePreview();
    document.getElementById("scalp-save").onclick = async () => {
      const form = {
        date: document.getElementById("sc-date").value,
        code: document.getElementById("sc-code").value.trim(),
        name: document.getElementById("sc-name").value.trim(),
        account: document.getElementById("sc-account").value.trim(),
        buy_price: Number(document.getElementById("sc-buy").value),
        sell_price: Number(document.getElementById("sc-sell").value),
        qty: Number(document.getElementById("sc-qty").value),
        fee: Number(document.getElementById("sc-fee").value) || 0,
        memo: document.getElementById("sc-memo").value.trim(),
      };
      if (!form.code || !form.name || !form.buy_price || !form.sell_price || !form.qty) { showToast("종목코드/종목명/매수가/매도가/수량은 필수입니다", "error"); return; }
      if (scalpModal.editing) {
        const { error } = await sb.from("scalp_trades").update(form).eq("id", scalpModal.editing.id);
        if (error) { showToast("저장 실패: " + error.message, "error"); return; }
        Object.assign(scalpModal.editing, rowToScalp(form));
      } else {
        const { data, error } = await sb.from("scalp_trades").insert(form).select().single();
        if (error) { showToast("저장 실패: " + error.message, "error"); return; }
        scalps.push(rowToScalp(data));
      }
      await registerStockIfNew(form.code, form.name, "국내");
      showToast(scalpModal.editing ? "단타 기록을 수정했습니다" : "단타 기록을 저장했습니다");
      scalpModal = null; render();
    };
  }
}

// ---------------------------------------------------------------------
// boot
// ---------------------------------------------------------------------
if (NOT_CONFIGURED) { render(); } else { loadAll(); }
</script>
</body>
